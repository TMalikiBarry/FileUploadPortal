<input (click)="getEvent($event)" hidden id='file_cni' type='file'/>
<div class="under-big-body mat-elevation-z2">
  <h2>Importer les dossiers de l'agent <em style="color: blue">{{currentAgent.name | formatName: 'name'}}</em></h2>
  <mat-grid-list cols="2" rowHeight="7rem">
    <mat-grid-tile>
      <div class="upload-file">
        <p>CNI</p>
        <button (click)="onUpload('cni')" mat-stroked-button>
          <span>Importer l'image ou le fichier</span>
          <mat-icon color="primary">image</mat-icon>
        </button>
      </div>
    </mat-grid-tile>
    <mat-grid-tile>
      <div class="uploaded-file">


      </div>
    </mat-grid-tile>
    <mat-grid-tile>
      <div class="upload-file">
        <p>Géolocalisation</p>
        <button (click)="onUpload('geoloc')" mat-stroked-button>
          <span>Importer l'image ou le fichier</span>
          <mat-icon color="primary">location_on</mat-icon>
        </button>
      </div>
    </mat-grid-tile>
    <mat-grid-tile>
      <div class="uploaded-file">
        <p>1</p>

      </div>
    </mat-grid-tile>
    <mat-grid-tile>
      <div class="upload-file">
        <p>Déclaration de l'honneur</p>
        <button (click)="onUpload('honneur')" mat-stroked-button>
          <span>Importer l'image ou le fichier</span>
          <mat-icon color="primary">insert_drive_file</mat-icon>
        </button>
      </div>
    </mat-grid-tile>
    <mat-grid-tile>
      <div class="uploaded-file">
        <p>1</p>

      </div>
    </mat-grid-tile>
    <mat-grid-tile>
      <div class="upload-file">
        <p>Fiche de connaissance</p>
        <button (click)="onUpload('connaissance')" mat-stroked-button>
          <span>Importer l'image ou le fichier</span>
          <mat-icon color="primary">insert_drive_file</mat-icon>
        </button>
      </div>
    </mat-grid-tile>
    <mat-grid-tile>
      <div class="uploaded-file">
        <p>1</p>

      </div>
    </mat-grid-tile>
    <mat-grid-tile>
      <div class="upload-file">
        <p>CGU</p>
        <button (click)="onUpload('CGU')" mat-stroked-button>
          <span>Importer l'image ou le fichier</span>
          <mat-icon color="primary">insert_drive_file</mat-icon>
        </button>
      </div>
    </mat-grid-tile>
    <mat-grid-tile>
      <div class="uploaded-file">
        <p>1</p>

      </div>
    </mat-grid-tile>
    <mat-grid-tile>

    </mat-grid-tile>
    <mat-grid-tile>
      <div class="save-files">
        <button class="animateMe mat-elevation-z4" color="primary" mat-raised-button>
          <span>Sauvegarder</span>
          <mat-icon>save</mat-icon>
        </button>
      </div>
    </mat-grid-tile>
  </mat-grid-list>
</div>
